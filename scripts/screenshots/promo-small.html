<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Research Companion promo tile</title>
  <link rel="stylesheet" href="../../src/styles/tokens.css" />
  <style>
    html, body { margin: 0; width: 440px; height: 280px; }
    body {
      box-sizing: border-box;
      padding: 32px;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-bottom: 6px solid var(--color-accent);
    }
    svg { width: 72px; height: 72px; }
    h1 { margin: 0 0 8px; font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 0; font-size: 16px; line-height: 1.4; color: var(--color-text-secondary); max-width: 340px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 72 72" role="img" aria-label="Linked nodes mark">
    <line x1="18" y1="54" x2="48" y2="24" stroke="var(--color-accent)" stroke-width="4" stroke-linecap="round" />
    <circle cx="16" cy="56" r="9" fill="var(--color-surface)" stroke="var(--color-border-strong)" stroke-width="2" />
    <circle cx="50" cy="22" r="16" fill="var(--color-accent)" />
  </svg>
  <div>
    <h1>Research Companion</h1>
    <p>Find related pages and articles for whatever you're reading, right in the side panel.</p>
  </div>
</body>
</html>
