name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste API keys or private page content.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page URL if it is public and relevant.
      placeholder: |
        1. Open ...
        2. Click the toolbar icon
        3. ...
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options: [Anthropic, OpenAI, Gemini, OpenRouter, Not applicable]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown at chrome://extensions
      placeholder: "0.1.3"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and OS
      placeholder: "Chrome 140, macOS 15"
  - type: textarea
    id: logs
    attributes:
      label: Console errors or screenshots
      description: From the side panel (right-click, Inspect) or chrome://extensions "Errors". Remove any keys.
